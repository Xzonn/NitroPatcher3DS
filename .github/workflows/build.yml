name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Build and package
        shell: pwsh
        run: ./build.ps1

      - name: Upload 3DS package
        uses: actions/upload-artifact@v7
        with:
          path: out/NitroPatcher3DS.zip
          archive: false
          if-no-files-found: error

      - name: Upload DSi package
        uses: actions/upload-artifact@v7
        with:
          path: out/NitroPatcherDSi.zip
          archive: false
          if-no-files-found: error

      - name: Upload NDS package
        uses: actions/upload-artifact@v7
        with:
          path: out/NitroPatcherNDS.zip
          archive: false
          if-no-files-found: error
